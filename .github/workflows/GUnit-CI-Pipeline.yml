name: Publish GUnit Packages

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release -o ./nupkg

      - name: Download Godot (GitHub Release)
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip -O godot.zip
          unzip godot.zip -d godot
          chmod +x godot/Godot_v4.6.2-stable_linux.x86_64

      - name: Install GUnit CLI Tool
        run: dotnet tool install --global Gunit.CLI --add-source ./nupkg

      - name: Create GUnit Config
        run: |
          echo "${GITHUB_WORKSPACE}/godot/Godot_v4.6.2-stable_linux.x86_64/Godot_v4.6.2-stable_linux.x86_64" | gunit config

      - name: Run Tests
        working-directory: ./GUnit.Demo
        run: gunit test

      - name: Publish to GitHub Packages
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key ${{ secrets.NUGET_TOKEN }} \
              --skip-duplicate
          done
